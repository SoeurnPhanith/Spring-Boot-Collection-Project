spring.application.name=retail-system-api

#================================
# MySql database Connection
#================================
spring.datasource.url=jdbc:mysql://localhost:3306/spring_boot_db_retail_system?serverTimezone=Asia/Phnom_Penh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#================================
# hibernate Jpa Config
#================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Phnom_Penh

# ===============================
# TIME ZONE (Cambodia)
# ===============================
spring.jackson.time-zone=Asia/Phnom_Penh

#========================================
# upload image or file config
#========================================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
file.upload-dir=uploads
